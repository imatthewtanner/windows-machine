name: Windows Machine CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: CampaignStudio.sln
      Test_Project_Path: tests/CampaignStudio.Web.Tests/CampaignStudio.Web.Tests.csproj
      Wap_Project_Directory: src/CampaignStudio.Web.Package
      Wap_Project_Path: src/CampaignStudio.Web.Package/CampaignStudio.Web.Package.wapproj
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup MSBuild.exe
      if: hashFiles(env.Wap_Project_Path) != ''
      uses: microsoft/setup-msbuild@v2

    - name: Restore solution
      shell: pwsh
      run: dotnet restore "$env:Solution_Name"

    - name: Execute unit tests
      shell: pwsh
      run: dotnet test "$env:Test_Project_Path" --configuration $env:Configuration --no-restore
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Decode the pfx
      if: matrix.configuration == 'Release' && github.event_name != 'pull_request' && hashFiles(env.Wap_Project_Path) != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:Base64_Encoded_Pfx)) {
          throw 'The Base64_Encoded_Pfx secret is not set; cannot sign the app package.'
        }
        $pfx_cert_byte = [System.Convert]::FromBase64String($env:Base64_Encoded_Pfx)
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)
      env:
        Base64_Encoded_Pfx: ${{ secrets.Base64_Encoded_Pfx }}

    - name: Create the app package
      if: matrix.configuration == 'Release' && github.event_name != 'pull_request' && hashFiles(env.Wap_Project_Path) != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        msbuild "$env:Wap_Project_Path" /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx /p:AppxBundlePlatforms="$env:Appx_Bundle_Platforms"
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x86|x64
        Appx_Package_Build_Mode: StoreUpload
        Configuration: ${{ matrix.configuration }}

    - name: Remove the pfx
      if: always() && matrix.configuration == 'Release' && github.event_name != 'pull_request' && hashFiles(env.Wap_Project_Path) != ''
      shell: pwsh
      run: Remove-Item -Path (Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx) -ErrorAction SilentlyContinue

    - name: Upload build artifacts
      if: matrix.configuration == 'Release' && github.event_name != 'pull_request' && hashFiles(env.Wap_Project_Path) != ''
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package - ${{ matrix.configuration }}
        path: ${{ env.Wap_Project_Directory }}/AppPackages
        if-no-files-found: error
