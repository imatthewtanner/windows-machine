image: Visual Studio 2022

configuration:
  - Release

environment:
  Solution_Name: CampaignStudio.sln
  Test_Project_Path: tests\CampaignStudio.Web.Tests\CampaignStudio.Web.Tests.csproj
  DOTNET_INSTALL_DIR: C:\dotnet

install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      New-Item -ItemType Directory -Force -Path $env:DOTNET_INSTALL_DIR | Out-Null
      $installScript = Join-Path $env:TEMP 'dotnet-install.ps1'
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installScript
      & $installScript -Channel 10.0 -InstallDir $env:DOTNET_INSTALL_DIR
      if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
        throw "dotnet-install.ps1 failed with exit code $LASTEXITCODE"
      }
      $env:Path = "$env:DOTNET_INSTALL_DIR;$env:Path"
      Update-AppveyorBuild -Message "Installed .NET SDK: $(dotnet --version)"

before_build:
  - ps: $env:Path = "$env:DOTNET_INSTALL_DIR;$env:Path"
  - ps: dotnet restore $env:Solution_Name

build_script:
  # $env:CONFIGURATION is set automatically by AppVeyor from the `configuration` matrix above.
  - ps: dotnet build $env:Solution_Name --configuration $env:CONFIGURATION --no-restore

test_script:
  - ps: dotnet test $env:Test_Project_Path --configuration $env:CONFIGURATION --no-restore

after_build:
  - ps: |
      if ($env:CONFIGURATION -eq 'Release') {
        $output = Join-Path $env:APPVEYOR_BUILD_FOLDER 'artifacts\iis'
        if (Test-Path $output) {
          Remove-Item $output -Recurse -Force
        }
        dotnet publish (Join-Path $env:APPVEYOR_BUILD_FOLDER 'src\CampaignStudio.Web\CampaignStudio.Web.csproj') `
          --configuration Release --runtime win-x64 --self-contained false `
          --output $output --no-restore
        if ($LASTEXITCODE -ne 0) {
          throw "dotnet publish failed with exit code $LASTEXITCODE"
        }
        $zipPath = Join-Path $env:APPVEYOR_BUILD_FOLDER 'artifacts\CampaignStudio-IIS.zip'
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Push-Location $output
        try {
          7z a -tzip $zipPath .\*
        } finally {
          Pop-Location
        }
        if ($LASTEXITCODE -ne 0) {
          throw "7z packaging failed with exit code $LASTEXITCODE"
        }
      }

artifacts:
  - path: artifacts\CampaignStudio-IIS.zip
    name: CampaignStudio-IIS
    type: Zip

# The MSIX packaging project (Wap_Project) requires MSBuild/msbuild.exe and is
# built only in the GitHub Actions workflow; it is intentionally skipped here.
